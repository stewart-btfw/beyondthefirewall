name: Uptime check

# Cheap uptime monitoring with no new third-party account: a failed run here
# shows up red in the Actions tab and triggers GitHub's own notification
# (email/web, per your GitHub notification settings) to whoever owns/watches
# this repo.
#
# Caveat: GitHub disables scheduled workflows after 60 days with no repo
# activity. If this repo goes quiet, re-enable it from the Actions tab (or
# add an external monitor such as Cloudflare Health Checks) so alerting
# doesn't silently stop.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # Check every domain even if one fails, so the run shows exactly which.
      fail-fast: false
      matrix:
        domain:
          - beyondthefirewall.me
          - beyondthefirewall.io
          - beyondthefirewall.org
          - beyondthefirewall.app
          - beyondthefirewall.co.uk
          - beyondthefirewall.info
          - beyondthefirewall.uk
    steps:
      # Non-canonical domains answer with a 301 to beyondthefirewall.me at
      # Cloudflare's edge (not followed here — curl -f only fails on >= 400),
      # so those checks confirm the edge redirect; .me's checks the Pi itself.
      # Custom UA to identify this traffic as the uptime monitor, not a
      # generic bot — Bot Fight Mode is currently off on every zone (AI
      # Labyrinth + crawler protection used instead), so this isn't load-
      # bearing today. A WAF rule to skip-list this UA was tried on .me on
      # 21 Sep 2026 and reverted four minutes later — likely because the
      # free-plan Bot Fight Mode can't be selectively skipped by a WAF rule
      # — so don't assume one exists if Bot Fight Mode ever gets re-enabled;
      # check first.
      - name: Check ${{ matrix.domain }}
        run: curl -fsS -A "BTFW-Uptime-Monitor/1.0" --retry 2 --retry-delay 5 --max-time 15 "https://${{ matrix.domain }}" -o /dev/null
