name: Terraform checks

# Formatting + static validation only. No credentials, no backend, no plan —
# `terraform plan`/`apply` stay manual (see infra/README.md).

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-check.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-check.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [infra/warp-pi-access, infra/cloudflare]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
