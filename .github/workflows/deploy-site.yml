name: Deploy marketing site

# Pulls the latest static site files onto the Raspberry Pi's docroot, which
# serves both beyondthefirewall.io and beyondthefirewall.me (Cloudflare
# Tunnel routes both hostnames there — see infra/warp-pi-access/). Pushing
# here doesn't update the live site by itself, this workflow does.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - '*.svg'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy-pi:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Pull latest on the Pi
        env:
          SSH_KEY: ${{ secrets.PI_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/pi_deploy_key
          chmod 600 ~/.ssh/pi_deploy_key
          # The Pi's authorized_keys forces this connection straight into
          # `cd /var/www/html && git pull` regardless of what's requested
          # here, so the trailing `true` is just a placeholder command.
          ssh -i ~/.ssh/pi_deploy_key \
            -o ProxyCommand="cloudflared access ssh --hostname %h" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            liversalts@ssh.beyondthefirewall.io true
