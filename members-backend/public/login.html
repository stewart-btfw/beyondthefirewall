<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond the Firewall — Members Login</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/members/login.css">
</head>
<body>
<main>
  <p class="status"><span class="dot"></span>Members login</p>
  <h1><a href="/"><img src="/btf-logo-lockup.svg" alt="Beyond the Firewall" width="252" height="64"></a></h1>
  <form id="login-form" novalidate>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <p class="error" id="login-error"></p>
    <p class="info" id="login-info"></p>

    <button type="button" id="login-submit">Sign in</button>
  </form>
  <form id="mfa-form" novalidate style="display:none;">
    <label for="mfa-login-code">6-digit code from your authenticator app</label>
    <input type="text" id="mfa-login-code" name="mfa-login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">

    <p class="error" id="mfa-login-error"></p>

    <button type="button" id="mfa-login-submit">Verify</button>
  </form>
  <p class="foot"><button type="button" id="forgot-password" class="link-btn">Forgot password?</button></p>
</main>
<script type="module" src="/members/dist/login.bundle.js"></script>
</body>
</html>
